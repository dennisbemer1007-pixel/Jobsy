# Allow documented local-dev placeholders and demo passwords only.
# Real secrets must never be committed; CI gitleaks fails on anything else.

title = "Jobsy / Lobsy gitleaks allowlist"

[extend]
useDefault = true

[allowlist]
description = "Development placeholders and admin setting keys (not secrets)"
paths = [
  '''(^|/)appsettings\.Development\.json$''',
  '''PlatformSettingsCatalog\.cs$''',
]
regexes = [
  '''local-dev-[A-Za-z0-9_-]+''',
  '''Jobsy123!''',
  '''Lobsy123!''',
]
