name: Code quality

on:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Jobsy.sln

      - name: Build (Release) and enforce warning baseline
        run: |
          set -euo pipefail
          chmod +x .github/scripts/count-build-warnings.sh
          dotnet build Jobsy.sln -c Release --no-restore --no-incremental -v minimal \
            2>&1 | tee /tmp/jobsy-build.log
          count="$(.github/scripts/count-build-warnings.sh /tmp/jobsy-build.log)"
          baseline="$(tr -d '[:space:]' < .github/quality/warning-baseline.txt)"
          echo "Unique warnings: $count (baseline: $baseline)"
          if [[ "$count" -gt "$baseline" ]]; then
            echo "::error::Warning count $count exceeds baseline $baseline. Fix new warnings or intentionally raise the baseline in the same PR."
            exit 1
          fi
          if [[ "$count" -lt "$baseline" ]]; then
            echo "::notice::Warning count dropped to $count (baseline $baseline). Consider lowering .github/quality/warning-baseline.txt."
          fi

      - name: Whitespace format (changed .cs files only)
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${base_sha}"...HEAD -- '*.cs' || true)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No changed .cs files; skipping format check."
            exit 0
          fi
          echo "Checking ${#files[@]} changed .cs file(s)"
          dotnet format whitespace Jobsy.sln --verify-no-changes --include "${files[@]}"

      - name: Vulnerable package gate
        run: |
          set -euo pipefail
          # `dotnet list --vulnerable` exits 0 even when vulnerable packages exist.
          out="$(dotnet list Jobsy.sln package --vulnerable --include-transitive 2>&1 || true)"
          echo "$out"
          if echo "$out" | grep -Eiq '^\s*>.*(Critical|High)\s'; then
            echo "::error::High/Critical vulnerable NuGet package(s) detected."
            exit 1
          fi
          if echo "$out" | grep -Eiq 'Severity|Moderate|vulnerable'; then
            # Moderate (e.g. AngleSharp NU1902) is tracked for package cleanup; warn only.
            if echo "$out" | grep -Eiq 'Moderate'; then
              echo "::warning::Moderate vulnerable NuGet package(s) present (allowed until package cleanup)."
            fi
          fi

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
