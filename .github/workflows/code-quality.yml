name: Code quality

on:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Jobsy.sln

      - name: Warning counter self-test
        run: |
          set -euo pipefail
          chmod +x .github/scripts/count-build-warnings.sh .github/scripts/count-build-warnings.selftest.sh
          .github/scripts/count-build-warnings.selftest.sh

      - name: Build (Release) and require zero warnings
        run: |
          set -euo pipefail
          chmod +x .github/scripts/count-build-warnings.sh
          # TreatWarningsAsErrors is on (Directory.Build.props); the build fails on any warning
          # except NU190x (kept as warnings; High/Critical still fail the vulnerable-package gate).
          dotnet build Jobsy.sln -c Release --no-restore --no-incremental -v minimal \
            2>&1 | tee /tmp/jobsy-build.log
          .github/scripts/count-build-warnings.sh --summary /tmp/jobsy-build.log >/tmp/jobsy-warn-count.txt 2>/tmp/jobsy-warn-summary.txt
          count="$(tr -d '[:space:]' </tmp/jobsy-warn-count.txt)"
          echo "Unique warnings: $count (must be 0)"
          echo "Per-code summary:"
          cat /tmp/jobsy-warn-summary.txt || true
          if [[ "$count" -ne 0 ]]; then
            echo "::error::Warning count $count is not zero. Fix warnings in the same PR (code-health 11)."
            exit 1
          fi

      - name: Whitespace format (changed .cs files only)
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${base_sha}"...HEAD -- '*.cs' || true)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No changed .cs files; skipping format check."
            exit 0
          fi
          echo "Checking ${#files[@]} changed .cs file(s)"
          dotnet format whitespace Jobsy.sln --verify-no-changes --include "${files[@]}"

      - name: Vulnerable package gate
        run: |
          set -euo pipefail
          # `dotnet list --vulnerable` exits 0 even when vulnerable packages exist.
          out="$(dotnet list Jobsy.sln package --vulnerable --include-transitive 2>&1 || true)"
          echo "$out"
          if echo "$out" | grep -Eiq '^\s*>.*(Critical|High)\s'; then
            echo "::error::High/Critical vulnerable NuGet package(s) detected."
            exit 1
          fi
          if echo "$out" | grep -Eiq 'Severity|Moderate|vulnerable'; then
            # Moderate (e.g. AngleSharp NU1902) is tracked for package cleanup; warn only.
            if echo "$out" | grep -Eiq 'Moderate'; then
              echo "::warning::Moderate vulnerable NuGet package(s) present (allowed until package cleanup)."
            fi
          fi


      - name: Setup Node (CSS minifier)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/css/package-lock.json

      - name: Verify app.min.css is built from app.css
        run: |
          set -euo pipefail
          chmod +x tools/css/build.sh
          tools/css/build.sh
          if ! git diff --exit-code -- Jobsy.Web/wwwroot/css/app.min.css; then
            echo "::error::Jobsy.Web/wwwroot/css/app.min.css is out of date. Run tools/css/build.sh and commit the result."
            exit 1
          fi

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
