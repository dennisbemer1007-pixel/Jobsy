name: PR tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JOBSY_E2E_BASE_URL: ${{ secrets.JOBSY_E2E_BASE_URL }}
      JOBSY_E2E_CANDIDATE_EMAIL: ${{ secrets.JOBSY_E2E_CANDIDATE_EMAIL }}
      JOBSY_E2E_CANDIDATE_PASSWORD: ${{ secrets.JOBSY_E2E_CANDIDATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Jobsy.sln

      - name: Build
        run: dotnet build Jobsy.sln --no-restore -c Release

      - name: Install Playwright Chromium
        if: env.JOBSY_E2E_BASE_URL != ''
        run: |
          dotnet build Jobsy.Tests/Jobsy.Tests.csproj -c Release --no-restore
          pwsh Jobsy.Tests/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test Jobsy.Tests/Jobsy.Tests.csproj -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
          if-no-files-found: ignore
