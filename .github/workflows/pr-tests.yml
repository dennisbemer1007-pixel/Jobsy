name: PR tests

on:
  pull_request:
  push:
    branches: [main, acceptatie]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        # PostGIS required — API migrate runs CREATE EXTENSION postgis.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: JobsyCi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__JobsyDb: Host=127.0.0.1;Port=5432;Database=JobsyCi;Username=postgres;Password=postgres
      JOBSY_CI_WEB_URL: http://127.0.0.1:5201
      JOBSY_E2E_BASE_URL: http://127.0.0.1:5201
      VerificationCodes__Pepper: ci-verification-otp-pepper-32chars!!
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Jobsy.sln

      - name: Build
        run: dotnet build Jobsy.sln --no-restore -c Release

      - name: Unit + integration tests
        run: |
          # Exclude browser E2E classes here — Chromium is installed only for the smoke step.
          # JOBSY_E2E_BASE_URL is set for the smoke stack, so soft-skip Playwright tests would
          # otherwise launch browsers during this phase and fail.
          # xunit.v3 + MTP (.NET 10): VSTest --filter FullyQualifiedName is replaced by --filter-not-class.
          mkdir -p test-results
          dotnet test --project Jobsy.Tests/Jobsy.Tests.csproj -c Release --no-build -- \
            --filter-not-class '*MobileSmokePlaywrightTests' \
            --filter-not-class '*Mobile_candidate_tab_switching*' \
            --filter-not-class '*Blazor_circuit_starts*' \
            --filter-not-class '*Acc2709PlaywrightTests' \
            --filter-not-class '*OnboardingWizardV2PlaywrightTests' \
            --filter-not-class '*BanenkaartPersistSizePlaywrightTests' \
            --filter-not-class '*BanenkaartMapReusePlaywrightTests' \
            --filter-not-class '*BanenkaartV3PlaywrightTests' \
            --filter-not-class '*BanenkaartClusterCardPlaywrightTests' \
            --filter-not-class '*FilterSheetFooterPlaywrightTests' \
            --filter-not-class '*BanenkaartCookiePaddingPlaywrightTests' \
            --filter-not-class '*BanenkaartListRerenderPlaywrightTests' \
            --filter-not-class '*CandidateTabStabilityPlaywrightTests' \
            --filter-not-class '*JobMapPinsClustersPlaywrightTests' \
            --filter-not-class '*CandidateApplicationsPlaywrightTests' \
            --filter-not-class '*MijnDnaAndTestsMobilePlaywrightTests' \
            --filter-not-class '*LoginPlaywrightTests' \
            --filter-not-class '*GratisDnaPlaywrightTests' \
            --filter-not-class '*MainLayoutTtfbPlaywrightTests' \
            --filter-not-class '*PersistLcpPlaywrightTests' \
            --filter-not-class '*BanenkaartMapPerfPlaywrightTests' \
            --filter-not-class '*LandingPlaywrightTests' \
            --filter-not-class '*EmailRenderPlaywrightTests' \
            --filter-not-class '*AuthA11yPlaywrightTests' \
            --filter-not-class '*AuthE2EPlaywrightTests' \
            --filter-not-class '*AuthMfaE2EPlaywrightTests' \
            --filter-not-class '*AuthProviderE2EPlaywrightTests' \
            --filter-not-class '*AuthRtlKeyboardPlaywrightTests' \
            --filter-not-class '*CspSmokePlaywrightTests' \
            --filter-not-class '*StatusPagesPlaywrightTests' \
            --filter-not-class '*PublicPagesPlaywrightTests' \
            --report-trx --results-directory test-results

      - name: Install Playwright Chromium
        run: |
          pwsh Jobsy.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start API + Web (seeded Development)
        run: |
          chmod +x .github/scripts/start-ci-stack.sh
          .github/scripts/start-ci-stack.sh

      - name: Playwright mobile smoke
        run: |
          mkdir -p artifacts/playwright-smoke test-results
          # Multiple --filter-class flags are OR'd by xunit.v3 MTP.
          dotnet test --project Jobsy.Tests/Jobsy.Tests.csproj -c Release --no-build -- \
            --filter-class '*MobileSmokePlaywrightTests' \
            --filter-class '*Mobile_candidate_tab_switching*' \
            --filter-class '*Blazor_circuit_starts*' \
            --filter-class '*BanenkaartPersistSizePlaywrightTests' \
            --filter-class '*BanenkaartMapReusePlaywrightTests' \
            --filter-class '*BanenkaartV3PlaywrightTests' \
            --filter-class '*BanenkaartClusterCardPlaywrightTests' \
            --filter-class '*FilterSheetFooterPlaywrightTests' \
            --filter-class '*BanenkaartCookiePaddingPlaywrightTests' \
            --filter-class '*BanenkaartListRerenderPlaywrightTests' \
            --filter-class '*CandidateApplicationsPlaywrightTests' \
            --filter-class '*MijnDnaAndTestsMobilePlaywrightTests' \
            --filter-class '*LoginPlaywrightTests' \
            --filter-class '*GratisDnaPlaywrightTests' \
            --filter-class '*MainLayoutTtfbPlaywrightTests' \
            --filter-class '*PersistLcpPlaywrightTests' \
            --filter-class '*BanenkaartMapPerfPlaywrightTests' \
            --filter-class '*LandingPlaywrightTests' \
            --filter-class '*EmailRenderPlaywrightTests' \
            --filter-class '*AdminEmailPreviewSmokeTests' \
            --filter-class '*AuthA11yPlaywrightTests' \
            --filter-class '*AuthE2EPlaywrightTests' \
            --filter-class '*AuthMfaE2EPlaywrightTests' \
            --filter-class '*AuthProviderE2EPlaywrightTests' \
            --filter-class '*AuthRtlKeyboardPlaywrightTests' \
            --filter-class '*CspSmokePlaywrightTests' \
            --filter-class '*StatusPagesPlaywrightTests' \
            --filter-class '*PublicPagesPlaywrightTests' \
            --report-trx --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results/*.trx"
          if-no-files-found: ignore

      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: |
            artifacts/playwright-smoke/**
            artifacts/playwright-dna/**
            artifacts/playwright-gratis-dna/**
            artifacts/playwright-email/**
            artifacts/playwright-errors/**
            artifacts/playwright-public/**
          if-no-files-found: ignore

      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-stack-logs
          path: /tmp/jobsy-ci-logs/**
          if-no-files-found: ignore
