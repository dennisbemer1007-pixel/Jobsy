name: PR tests

on:
  pull_request:
  push:
    branches: [main, acceptatie]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        # PostGIS required — API migrate runs CREATE EXTENSION postgis.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: JobsyCi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__JobsyDb: Host=127.0.0.1;Port=5432;Database=JobsyCi;Username=postgres;Password=postgres
      JOBSY_CI_WEB_URL: http://127.0.0.1:5201
      JOBSY_E2E_BASE_URL: http://127.0.0.1:5201
      VerificationCodes__Pepper: ci-verification-otp-pepper-32chars!!
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Jobsy.sln

      - name: Build
        run: dotnet build Jobsy.sln --no-restore -c Release

      - name: Unit + integration tests
        run: |
          dotnet test Jobsy.Tests/Jobsy.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName!~MobileSmokePlaywrightTests&FullyQualifiedName!~Mobile_candidate_tab_switching&FullyQualifiedName!~Blazor_circuit_starts&FullyQualifiedName!~CandidateApplicationsPlaywrightTests" \
            --logger "trx;LogFileName=unit-results.trx"

      - name: Install Playwright Chromium
        run: |
          pwsh Jobsy.Tests/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      - name: Start API + Web (seeded Development)
        run: |
          chmod +x .github/scripts/start-ci-stack.sh
          .github/scripts/start-ci-stack.sh

      - name: Playwright mobile smoke
        run: |
          mkdir -p artifacts/playwright-smoke
          dotnet test Jobsy.Tests/Jobsy.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~MobileSmokePlaywrightTests|FullyQualifiedName~Mobile_candidate_tab_switching|FullyQualifiedName~Blazor_circuit_starts|FullyQualifiedName~CandidateApplicationsPlaywrightTests" \
            --logger "trx;LogFileName=smoke-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results/*.trx"
          if-no-files-found: ignore

      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: artifacts/playwright-smoke/**
          if-no-files-found: ignore

      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-stack-logs
          path: /tmp/jobsy-ci-logs/**
          if-no-files-found: ignore
