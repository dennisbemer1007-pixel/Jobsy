name: PR tests

on:
  pull_request:
  push:
    branches: [main, acceptatie, "cursor/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    # Unit+integration + Playwright smoke; cap job so a hung test cannot burn 2.5h.
    timeout-minutes: 90
    services:
      postgres:
        # PostGIS required — API migrate runs CREATE EXTENSION postgis.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: JobsyCi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__JobsyDb: Host=127.0.0.1;Port=5432;Database=JobsyCi;Username=postgres;Password=postgres
      VerificationCodes__Pepper: ci-verification-otp-pepper-32chars!!
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Jobsy.sln

      - name: Build
        run: dotnet build Jobsy.sln --no-restore -c Release

      - name: Unit + integration tests
        env:
          # Stack is not up yet — unset E2E URLs so soft-skip browser tests do not hit :5201.
          JOBSY_E2E_BASE_URL: ""
          JOBSY_CI_WEB_URL: ""
        run: |
          # Exclude browser E2E classes here — Chromium is installed only for the smoke step.
          # xunit.v3 + MTP (.NET 10): pass filters as first-class options (no `--` separator).
          # *Playwright* is necessary but not sufficient: screenshot/a11y classes also install Chromium.
          mkdir -p test-results
          dotnet test --project Jobsy.Tests/Jobsy.Tests.csproj -c Release --no-build \
            --results-directory test-results \
            --report-trx \
            --timeout 85m \
            --hangdump \
            --hangdump-timeout 25m \
            --filter-not-class '*Playwright*' \
            --filter-not-class '*Screenshot*' \
            --filter-not-class 'AcceptatieOct2026BugfixTests' \
            --filter-not-class 'BlazorReconnectAndHealthzTests' \
            --filter-not-class 'LandingA11yTests' \
            --filter-not-class 'ProactiveMatchingRealStackE2eTests'

      - name: Install Playwright Chromium
        run: |
          pwsh Jobsy.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start API + Web (seeded Development)
        run: |
          chmod +x .github/scripts/start-ci-stack.sh
          .github/scripts/start-ci-stack.sh

      - name: Playwright mobile smoke
        env:
          JOBSY_CI_WEB_URL: http://127.0.0.1:5201
          JOBSY_E2E_BASE_URL: http://127.0.0.1:5201
        run: |
          mkdir -p artifacts/playwright-smoke test-results
          # Multiple --filter-class flags are OR'd by xunit.v3 MTP (no `--` separator).
          dotnet test --project Jobsy.Tests/Jobsy.Tests.csproj -c Release --no-build \
            --results-directory test-results \
            --report-trx \
            --timeout 45m \
            --hangdump \
            --hangdump-timeout 15m \
            --filter-class '*MobileSmokePlaywrightTests' \
            --filter-class '*Mobile_candidate_tab_switching*' \
            --filter-class '*Blazor_circuit_starts*' \
            --filter-class '*BanenkaartPersistSizePlaywrightTests' \
            --filter-class '*BanenkaartMapReusePlaywrightTests' \
            --filter-class '*BanenkaartV3PlaywrightTests' \
            --filter-class '*BanenkaartClusterCardPlaywrightTests' \
            --filter-class '*FilterSheetFooterPlaywrightTests' \
            --filter-class '*BanenkaartCookiePaddingPlaywrightTests' \
            --filter-class '*BanenkaartListRerenderPlaywrightTests' \
            --filter-class '*BanenkaartMobileOverflowPlaywrightTests' \
            --filter-class '*LoginPlaywrightTests' \
            --filter-class '*GratisDnaPlaywrightTests' \
            --filter-class '*MainLayoutTtfbPlaywrightTests' \
            --filter-class '*PersistLcpPlaywrightTests' \
            --filter-class '*BanenkaartMapPerfPlaywrightTests' \
            --filter-class '*EmailRenderPlaywrightTests' \
            --filter-class '*AdminEmailPreviewSmokeTests' \
            --filter-class '*AuthA11yPlaywrightTests' \
            --filter-class '*AuthE2EPlaywrightTests' \
            --filter-class '*AuthMfaE2EPlaywrightTests' \
            --filter-class '*AuthProviderE2EPlaywrightTests' \
            --filter-class '*AuthRtlKeyboardPlaywrightTests' \
            --filter-class '*CspSmokePlaywrightTests' \
            --filter-class '*ReconnectOverlayPlaywrightTests' \
            --filter-class '*StatusPagesPlaywrightTests' \
            --filter-class '*PublicPagesPlaywrightTests' \
            --filter-class '*BronnenPlaywrightTests' \
            --filter-class '*AdminOrganisationsPlaywrightTests' \
            --filter-class '*AdminShellPlaywrightTests' \
            --filter-class '*AdminUsersPlaywrightTests' \
            --filter-class '*AdminRun4PlaywrightTests' \
            --filter-class '*CandidateTestsPlaywrightTests' \
            --filter-class '*AssistantTabPlaywrightTests'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results/*.trx"
          if-no-files-found: ignore

      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: |
            artifacts/playwright-smoke/**
            artifacts/playwright-dna/**
            artifacts/playwright-gratis-dna/**
            artifacts/playwright-email/**
            artifacts/playwright-errors/**
            artifacts/playwright-public/**
          if-no-files-found: ignore

      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-stack-logs
          path: /tmp/jobsy-ci-logs/**
          if-no-files-found: ignore
