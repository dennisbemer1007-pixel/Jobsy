# Jobsy temporary free demo on Render.
# Docs: docs/deploy-render.md
#
# Free web services cannot receive private-network traffic from each other —
# use RENDER_EXTERNAL_URL for cross-service HTTP.
# All resources MUST share one region (private DB access).
#
# If you previously deployed with mixed regions, delete jobsy-api, jobsy-web,
# and jobsy-db in the Render Dashboard, then Manual sync this Blueprint.

databases:
  - name: jobsy-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: jobsy
    user: jobsy

services:
  - type: web
    name: jobsy-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Jobsy.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AllowedHosts
        value: "*"
      - key: JobsyAuth__AllowDevelopmentAuth
        value: "true"
      - key: JobsyFeatures__ExposeRegistrationActivationLinks
        value: "true"
      - key: ConnectionStrings__JobsyDb
        fromDatabase:
          name: jobsy-db
          property: connectionString
      - key: PublicWebBaseUrl
        fromService:
          name: jobsy-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: Cors__AllowedOrigins__0
        fromService:
          name: jobsy-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: jobsy-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Jobsy.Web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AllowedHosts
        value: "*"
      - key: ApiBaseUrl
        fromService:
          name: jobsy-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ConnectionStrings__JobsyDb
        fromDatabase:
          name: jobsy-db
          property: connectionString
