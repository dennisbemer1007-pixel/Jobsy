# Lobsy on Render — project Lobsy, environments Production + Acceptatie.
# Docs: docs/deploy-render.md · docs/release-flow.md
#
# Deploy branches (set in Dashboard if Blueprint sync does not apply `branch`):
#   Production (jobsy-api / jobsy-web)  → main
#   Acceptatie (lobsy-acc-api / web)    → acceptatie
# Nothing reaches lobsy.nl without a PR acceptatie → main + your approval.
#
# Starter web services do not spin down on idle.
# basic-256mb Postgres does not expire after 30 days (unlike free).
#
# Cross-service HTTP uses RENDER_EXTERNAL_URL.
# All resources MUST share one region (private DB access): frankfurt.
#
# Workspace service names must be unique, even across environments.
# Production MUST keep the original Render names (jobsy-api / jobsy-web / jobsy-db).
# Renaming them in this file creates a second paid stack and leaves the live DB behind.
# Acceptatie uses lobsy-acc-* so it cannot collide with Production.
#
# Do not also define these resources at the YAML root — that duplicates them.

projects:
  - name: Lobsy
    environments:
      - name: Production
        databases:
          - name: jobsy-db
            plan: basic-256mb
            region: frankfurt
            postgresMajorVersion: "16"
            databaseName: jobsy
            user: jobsy

        services:
          - type: web
            name: jobsy-api
            runtime: docker
            plan: starter
            region: frankfurt
            branch: main
            autoDeployTrigger: commit
            dockerfilePath: ./Jobsy.Api/Dockerfile
            dockerContext: .
            healthCheckPath: /health
            envVars:
              - key: ASPNETCORE_ENVIRONMENT
                value: Production
              - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
                value: "false"
              # "*" avoids Render health-check 400s when Host is localhost / internal / onrender subdomain.
              # Browser origin access is still limited by Cors__AllowedOrigins.
              - key: AllowedHosts
                value: "*"
              - key: JobsyAuth__AllowDevelopmentAuth
                value: "false"
              # Never enable stub payments or Mollie test_ keys on live production money paths.
              - key: JobsyAuth__AllowStubPayments
                value: "false"
              - key: Seed__Enabled
                value: "false"
              - key: JobsyAuth__DevelopmentAuthSecret
                generateValue: true
              - key: JobsyAuth__LocalSessionSigningKey
                generateValue: true
              - key: JobsyAuth__ExternalProvisionSecret
                generateValue: true
              # Shared Web→API secret for X-Jobsy-Client-Ip rate-limit partitioning.
              - key: JobsyAuth__InternalClientIpSecret
                generateValue: true
              # ES256 public key (PEM). Must match Web private key. Set in Dashboard.
              - key: JobsyAuth__Jwt__PublicKeyPem
                sync: false
              - key: JobsyAuth__Jwt__Issuer
                value: jobsy-web
              - key: JobsyAuth__Jwt__Audience
                value: jobsy-api
              # Same value on API and Web of this environment. Dashboard only — never commit a value.
              # Web sends it as X-Jobsy-Origin-Secret on server-side calls to ApiBaseUrl.
              # Browsers need a Cloudflare Transform Rule. Render probes: /health (API), /healthz (web).
              - key: CLOUDFLARE_ORIGIN_SECRET
                sync: false
              - key: Sentry__Dsn
                sync: false
              # Feedback agents always base on acceptatie — never open PRs against main.
              - key: CursorCloud__Ref
                value: acceptatie
              - key: Training__TrackingSecret
                generateValue: true
              - key: Swagger__Enabled
                value: "false"
              - key: VerificationCodes__Pepper
                generateValue: true
              - key: ConnectionStrings__JobsyDb
                fromDatabase:
                  name: jobsy-db
                  property: connectionString
              - key: PublicWebBaseUrl
                value: "https://lobsy.nl"
              - key: Lobsy__DeploymentEnvironment
                value: Production
              - key: TestAccounts__Enabled
                value: "false"
              - key: PublicApiBaseUrl
                fromService:
                  name: jobsy-api
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL
              - key: Cors__AllowedOrigins__0
                fromService:
                  name: jobsy-web
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL
              - key: Cors__AllowedOrigins__1
                value: "https://lobsy.nl"
              - key: Cors__AllowedOrigins__2
                value: "https://www.lobsy.nl"
              # Mail via Lettermint (EU). Keys stay in the Dashboard — do not commit secrets.
              # Without Lettermint__ApiKey, mail is not sent. Resend is not a fallback.
              - key: Mail__Provider
                value: Lettermint
              - key: Mail__ResendApiKey
                sync: false
              - key: Mail__FromAddress
                sync: false
              - key: Lettermint__ApiKey
                sync: false
              # Production AI stays on OpenAI (the code default). Do not set Ai__Provider=Mistral here.
              # VAPID keys for Web Push (generate once; do not rotate casually — see PR / docs).
              - key: WebPush__Subject
                sync: false
              - key: WebPush__PublicKey
                sync: false
              - key: WebPush__PrivateKey
                sync: false

          - type: web
            name: jobsy-web
            runtime: docker
            plan: starter
            region: frankfurt
            branch: main
            autoDeployTrigger: commit
            dockerfilePath: ./Jobsy.Web/Dockerfile
            dockerContext: .
            # healthCheckPath takes effect on Blueprint sync.
            healthCheckPath: /healthz
            envVars:
              - key: ASPNETCORE_ENVIRONMENT
                value: Production
              - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
                value: "false"
              - key: AllowedHosts
                value: "*"
              - key: JobsyAuth__AllowDevelopmentAuth
                value: "false"
              - key: JobsyAuth__DevelopmentAuthSecret
                fromService:
                  name: jobsy-api
                  type: web
                  envVarKey: JobsyAuth__DevelopmentAuthSecret
              - key: JobsyAuth__LocalSessionSigningKey
                fromService:
                  name: jobsy-api
                  type: web
                  envVarKey: JobsyAuth__LocalSessionSigningKey
              - key: JobsyAuth__ExternalProvisionSecret
                fromService:
                  name: jobsy-api
                  type: web
                  envVarKey: JobsyAuth__ExternalProvisionSecret
              - key: JobsyAuth__InternalClientIpSecret
                fromService:
                  name: jobsy-api
                  type: web
                  envVarKey: JobsyAuth__InternalClientIpSecret
              # ES256 private key (PEM). Pair with API public key. Set in Dashboard.
              - key: JobsyAuth__Jwt__PrivateKeyPem
                sync: false
              - key: JobsyAuth__Jwt__Issuer
                value: jobsy-web
              - key: JobsyAuth__Jwt__Audience
                value: jobsy-api
              # Same value as this environment's API. Dashboard only (sync: false). See docs/deploy-render.md.
              - key: CLOUDFLARE_ORIGIN_SECRET
                sync: false
              - key: Sentry__Dsn
                sync: false
              - key: Circuit__DetailedErrors
                value: "false"
              - key: ApiBaseUrl
                fromService:
                  name: jobsy-api
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL
              - key: ConnectionStrings__JobsyDb
                fromDatabase:
                  name: jobsy-db
                  property: connectionString
              - key: Lobsy__DeploymentEnvironment
                value: Production
              - key: TestAccounts__Enabled
                value: "false"
              # Same mail provider as the API so the privacy sentence matches the sender.
              - key: Mail__Provider
                value: Lettermint
              - key: Lettermint__ApiKey
                sync: false
              - key: WebPush__Subject
                sync: false
              - key: WebPush__PublicKey
                sync: false
              - key: WebPush__PrivateKey
                sync: false

      - name: Acceptatie
        databases:
          - name: lobsy-acc-db
            plan: basic-256mb
            region: frankfurt
            postgresMajorVersion: "16"
            databaseName: lobsy
            user: lobsy

        services:
          - type: web
            name: lobsy-acc-api
            runtime: docker
            plan: starter
            region: frankfurt
            branch: acceptatie
            autoDeployTrigger: commit
            dockerfilePath: ./Jobsy.Api/Dockerfile
            dockerContext: .
            healthCheckPath: /health
            envVars:
              - key: ASPNETCORE_ENVIRONMENT
                value: Production
              - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
                value: "false"
              - key: AllowedHosts
                value: "*"
              # Acc runs ASPNETCORE_ENVIRONMENT=Production; demo-login is 404 there.
              # Seed still creates local-login demo users for password login.
              - key: JobsyAuth__AllowDevelopmentAuth
                value: "false"
              # Feedback → Cursor Cloud Agents always PR against acceptatie, never main.
              - key: CursorCloud__Ref
                value: acceptatie
              - key: JobsyAuth__AllowStubPayments
                value: "true"
              - key: Seed__Enabled
                value: "true"
              - key: JobsyAuth__DevelopmentAuthSecret
                generateValue: true
              - key: JobsyAuth__LocalSessionSigningKey
                generateValue: true
              - key: JobsyAuth__ExternalProvisionSecret
                generateValue: true
              - key: JobsyAuth__InternalClientIpSecret
                generateValue: true
              - key: JobsyAuth__Jwt__PublicKeyPem
                sync: false
              - key: JobsyAuth__Jwt__Issuer
                value: jobsy-web
              - key: JobsyAuth__Jwt__Audience
                value: jobsy-api
              # Same value on API and Web of this environment. Dashboard only — never commit a value.
              - key: CLOUDFLARE_ORIGIN_SECRET
                sync: false
              - key: Sentry__Dsn
                sync: false
              - key: Training__TrackingSecret
                generateValue: true
              - key: Swagger__Enabled
                value: "false"
              - key: VerificationCodes__Pepper
                generateValue: true
              - key: ConnectionStrings__JobsyDb
                fromDatabase:
                  name: lobsy-acc-db
                  property: connectionString
              - key: PublicWebBaseUrl
                value: "https://acceptatie.lobsy.nl"
              - key: Lobsy__DeploymentEnvironment
                value: Acceptatie
              # Dennis sets true in Dashboard after passwords are configured.
              - key: TestAccounts__Enabled
                sync: false
              - key: TestAccounts__EmailDomain
                value: "lobsy.nl"
              - key: TestAccounts__Password__Candidate
                sync: false
              - key: TestAccounts__Password__CandidateNew
                sync: false
              - key: TestAccounts__Password__BranchManager
                sync: false
              - key: TestAccounts__Password__EnterpriseManager
                sync: false
              - key: TestAccounts__Password__RegionalManager
                sync: false
              - key: TestAccounts__Password__Intermediary
                sync: false
              - key: TestAccounts__Password__SalesManager
                sync: false
              - key: TestAccounts__Password__Admin
                sync: false
              - key: TestAccounts__Password__Ambassadeur
                sync: false
              - key: TestAccounts__Password__Teacher
                sync: false
              - key: TestAccounts__Password__SchoolAdmin
                sync: false
              - key: PublicApiBaseUrl
                fromService:
                  name: lobsy-acc-api
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL
              - key: Cors__AllowedOrigins__0
                fromService:
                  name: lobsy-acc-web
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL
              - key: Cors__AllowedOrigins__1
                value: "https://acceptatie.lobsy.nl"
              # Acceptatie mail: Lettermint. Without the key, mail is not sent (no Resend fallback).
              # Only test-*@lobsy.nl (and one extra address) may receive mail.
              - key: Mail__Provider
                value: Lettermint
              - key: Mail__ResendApiKey
                sync: false
              - key: Mail__FromAddress
                sync: false
              - key: Lettermint__ApiKey
                sync: false
              - key: Mail__AllowedRecipientPattern
                value: '^test-[^@]+@lobsy\.nl$'
              - key: Mail__AllowedRecipientAddresses__0
                sync: false
              # AI provider for Acceptatie. Leave unset to stay on OpenAI.
              # Set Ai__Provider=Mistral and Mistral__ApiKey in the Dashboard.
              # Leave Mistral__BaseUrl unset: the default is the EU endpoint api.eu.mistral.ai.
              # The privacy page treats Mistral as EU only when that host is api.eu.mistral.ai.
              # The web service needs the same provider and key so /privacy matches the API.
              - key: Ai__Provider
                sync: false
              - key: Mistral__ApiKey
                sync: false
              # Quality model (stories, coach, plans). Example: mistral-medium-latest.
              # Cheap calls (translation, CV, vacancy check) use Mistral__SmallModel when set.
              # Leave SmallModel empty to keep those calls on Mistral__Model.
              - key: Mistral__Model
                sync: false
              - key: Mistral__SmallModel
                sync: false
              - key: WebPush__Subject
                sync: false
              - key: WebPush__PublicKey
                sync: false
              - key: WebPush__PrivateKey
                sync: false

          - type: web
            name: lobsy-acc-web
            runtime: docker
            plan: starter
            region: frankfurt
            branch: acceptatie
            autoDeployTrigger: commit
            dockerfilePath: ./Jobsy.Web/Dockerfile
            dockerContext: .
            # branch + healthCheckPath take effect on Blueprint sync (or Dashboard branch setting).
            healthCheckPath: /healthz
            envVars:
              - key: ASPNETCORE_ENVIRONMENT
                value: Production
              - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
                value: "false"
              # Acceptatie only. Acc and prod both run ASPNETCORE_ENVIRONMENT=Production,
              # so this switch is not tied to IsProduction(). The production web service stays indexable.
              - key: Seo__NoIndex
                value: "true"
              - key: AllowedHosts
                value: "*"
              - key: JobsyAuth__AllowDevelopmentAuth
                value: "false"
              - key: JobsyAuth__DevelopmentAuthSecret
                fromService:
                  name: lobsy-acc-api
                  type: web
                  envVarKey: JobsyAuth__DevelopmentAuthSecret
              - key: JobsyAuth__LocalSessionSigningKey
                fromService:
                  name: lobsy-acc-api
                  type: web
                  envVarKey: JobsyAuth__LocalSessionSigningKey
              - key: JobsyAuth__ExternalProvisionSecret
                fromService:
                  name: lobsy-acc-api
                  type: web
                  envVarKey: JobsyAuth__ExternalProvisionSecret
              - key: JobsyAuth__InternalClientIpSecret
                fromService:
                  name: lobsy-acc-api
                  type: web
                  envVarKey: JobsyAuth__InternalClientIpSecret
              - key: JobsyAuth__Jwt__PrivateKeyPem
                sync: false
              - key: JobsyAuth__Jwt__Issuer
                value: jobsy-web
              - key: JobsyAuth__Jwt__Audience
                value: jobsy-api
              # Same value as this environment's API. Dashboard only (sync: false). See docs/deploy-render.md.
              - key: CLOUDFLARE_ORIGIN_SECRET
                sync: false
              - key: Sentry__Dsn
                sync: false
              - key: Circuit__DetailedErrors
                value: "true"
              - key: ApiBaseUrl
                fromService:
                  name: lobsy-acc-api
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL
              - key: ConnectionStrings__JobsyDb
                fromDatabase:
                  name: lobsy-acc-db
                  property: connectionString
              - key: Lobsy__DeploymentEnvironment
                value: Acceptatie
              - key: TestAccounts__Enabled
                sync: false
              # Same provider and key presence as the API, so the privacy page drops Resend when Lettermint sends.
              - key: Mail__Provider
                value: Lettermint
              - key: Lettermint__ApiKey
                sync: false
              - key: WebPush__Subject
                sync: false
              - key: WebPush__PublicKey
                sync: false
              - key: WebPush__PrivateKey
                sync: false
              # Same AI provider as lobsy-acc-api, so /privacy names the company that receives calls.
              # The web does not call the model. It checks the key and the base URL host.
              # Leave Mistral__BaseUrl unset: the default is the EU endpoint api.eu.mistral.ai.
              - key: Ai__Provider
                sync: false
              - key: Mistral__ApiKey
                sync: false
