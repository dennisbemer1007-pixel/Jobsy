<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lobsy mascot in-app preview</title>
  <link rel="stylesheet" href="../../Jobsy.Web/wwwroot/css/critical.css" />
  <link rel="stylesheet" href="../../Jobsy.Web/wwwroot/css/app.min.css" />
  <link rel="stylesheet" href="../../Jobsy.Web/wwwroot/css/features/ontdekkingsreis.css" />
  <link rel="stylesheet" href="../../Jobsy.Web/wwwroot/css/features/onboarding-wizard.css" />
  <style>
    body { margin: 0; background: var(--bg); font-family: var(--font); }
    .preview-header { padding: 12px 16px; font-weight: 600; color: var(--brand); border-bottom: 1px solid var(--border); background: var(--surface); }
    .split { display: grid; grid-template-columns: 1fr; gap: 24px; padding: 16px; }
    @media (min-width: 900px) { .split { grid-template-columns: 1fr 1fr; } }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-height: 360px; position: relative; }
    .panel h2 { margin: 0 0 12px; font-size: 1rem; }
    .journey-lz { position: relative; min-height: 280px; }
    .ob-wizard__sidebar { display: flex; flex-direction: column; gap: 8px; }
    .lobsy-coach-dock { position: absolute; right: 16px; bottom: 16px; }
    iframe { border: 0; width: 100%; height: 420px; background: transparent; }
  </style>
</head>
<body>
  <div class="preview-header">Ontdekkingsreis + sticky coach (SVG mascotte)</div>
  <div class="split">
    <section class="panel">
      <h2>Desktop ontdekkingsreis (1280)</h2>
      <iframe src="journey-coach-sticky-preview.html" title="Journey desktop"></iframe>
    </section>
    <section class="panel">
      <h2>Onboarding / coach dock</h2>
      <p class="muted">Uitleggen-avatar in de sticky coach-knop.</p>
      <div class="lobsy-coach-dock" data-lobsy-coach>
        <button type="button" class="lobsy-coach-dock__btn" style="width:64px;height:64px">
          <img src="../../Jobsy.Web/wwwroot/images/brand/mascot-128.png" alt="" width="64" height="64" style="width:100%;height:100%;object-fit:contain" />
        </button>
      </div>
    </section>
  </div>
</body>
</html>
