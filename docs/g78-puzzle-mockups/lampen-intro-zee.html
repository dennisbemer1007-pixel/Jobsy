<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Mockup · Lampen intro</title>
<link rel="stylesheet" href="../mockups/leerling/werelden/src/style.css">
<style>
body{margin:0;background:#f6efe0;font-family:Lexend,sans-serif}
.card{background:#fffdf8;border-radius:18px;padding:24px;max-width:720px;margin:40px auto}
.in-h{font-family:Fraunces,serif;font-size:44px;margin:6px 0}
.prev-row{display:flex;gap:14px;justify-content:center;margin:16px 0}
.slot{width:72px;height:72px;border-radius:50%;overflow:hidden;border:2px solid #b9d6d2}
.slot img{width:100%;height:100%;object-fit:cover}
.steps{list-style:none;padding:0;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:center;font-size:18px}
.steps span{width:28px;height:28px;border-radius:50%;background:#10284a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
</style>
</head>
<body>
<div class="card">
<p class="kicker">Puzzel 3 van 3</p>
<h1 class="in-h">Vuurtorenlampen</h1>
<p style="font-size:20px;color:#4c5a70">Onthoud het lichtpatroon en tik het na.</p>
<div class="prev-row">
<div class="slot"><img src="../../Jobsy.Web/wwwroot/images/leerling/werelden/puzzles/zee/lamp-1.jpg" alt=""></div>
<div class="slot"><img src="../../Jobsy.Web/wwwroot/images/leerling/werelden/puzzles/zee/lamp-2.jpg" alt=""></div>
<div class="slot"><img src="../../Jobsy.Web/wwwroot/images/leerling/werelden/puzzles/zee/lamp-3.jpg" alt=""></div>
</div>
<ol class="steps">
<li><span>1</span>Kijk hoe de lampen oplichten.</li>
<li><span>2</span>Onthoud de volgorde goed.</li>
<li><span>3</span>Tik daarna de lampen na.</li>
</ol>
</div>
</body>
</html>
