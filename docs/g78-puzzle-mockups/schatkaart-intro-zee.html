<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Mockup · Schatkaart intro</title>
<link rel="stylesheet" href="../mockups/leerling/werelden/src/style.css">
<link rel="stylesheet" href="../mockups/leerling/werelden/src/themes.css">
<style>
body{margin:0;background:#f6efe0;font-family:Lexend,sans-serif}
.card{background:#fffdf8;border-radius:18px;padding:24px;max-width:720px;margin:40px auto;box-shadow:0 8px 30px rgba(16,40,74,.12)}
.in-h{font-family:Fraunces,serif;font-size:44px;margin:6px 0}
.prev-row{display:grid;grid-template-columns:repeat(3,62px);gap:10px;justify-content:center;margin:16px 0}
.slot{width:62px;height:74px;border-radius:14px;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;border:2px solid #b9d6d2;overflow:hidden}
.slot img{width:100%;height:100%;object-fit:cover}
.steps{list-style:none;padding:0;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:center;font-size:18px}
.steps span{width:28px;height:28px;border-radius:50%;background:#10284a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
</style>
</head>
<body class="t-zee">
<div class="card">
<p class="kicker">Puzzel 2 van 3</p>
<h1 class="in-h">Schatkaart</h1>
<p style="font-size:20px;color:#4c5a70">Draai kaarten om en vind de paren.</p>
<div class="prev-row">
<div class="slot"><img src="../../Jobsy.Web/wwwroot/images/leerling/werelden/puzzles/zee/match-1.jpg" alt=""></div>
<div class="slot"><img src="../../Jobsy.Web/wwwroot/images/leerling/werelden/puzzles/zee/match-2.jpg" alt=""></div>
<div class="slot"><img src="../../Jobsy.Web/wwwroot/images/leerling/werelden/puzzles/zee/match-3.jpg" alt=""></div>
<div class="slot"><img src="../../Jobsy.Web/wwwroot/images/leerling/werelden/puzzles/zee/match-1.jpg" alt=""></div>
<div class="slot"><img src="../../Jobsy.Web/wwwroot/images/leerling/werelden/puzzles/zee/match-2.jpg" alt=""></div>
<div class="slot"><img src="../../Jobsy.Web/wwwroot/images/leerling/werelden/puzzles/zee/match-3.jpg" alt=""></div>
</div>
<ol class="steps">
<li><span>1</span>Bekijk de kaarten op tafel.</li>
<li><span>2</span>Draai twee kaarten tegelijk om.</li>
<li><span>3</span>Vind alle drie de paren.</li>
</ol>
</div>
</body>
</html>
