<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banenkaart header c</title>
<style>
:root{--bg:#faf6ef;--hero-d:150px;--hero-m:90px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg)}
.rustig-hero{position:relative;width:100%;height:var(--hero-d);overflow:hidden}
.rustig-hero img{width:100%;height:100%;object-fit:cover;display:block}
.rustig-hero img.mob{display:none}
.rustig-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,var(--bg) 0%,transparent 14%)}
.rustig-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 0%,transparent 70%,color-mix(in srgb,var(--bg) 55%,transparent) 88%,var(--bg) 100%)}
@media (max-width:700px){.rustig-hero{height:var(--hero-m)}.rustig-hero img.desk{display:none}.rustig-hero img.mob{display:block}}
</style></head><body>
<div class="rustig-hero" aria-hidden="true"><img class="desk" src="hero-c-desk.jpg" alt=""><img class="mob" src="hero-c-mob.jpg" alt=""></div>
</body></html>
