<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboarding A — Stap 1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <div class="topbar__brand">
        <img class="logo" src="../../../Jobsy.Web/wwwroot/images/brand/lobsy-64.webp" alt="" width="36" height="36" />
        Lobsy
      </div>
      <p class="topbar__meta">Stap 1 · ± 6 min</p>
    </header>
    <div class="shell">
      <aside class="sidebar" aria-label="Voortgang">
        <p class="sidebar__title">Startprofiel</p>
        <div class="sidebar__group is-active">Over jou</div>
        <div class="sidebar__group">Achtergrond</div>
        <div class="sidebar__group">Droom</div>
        <div class="sidebar__group">Wie ben jij</div>
        <div class="sidebar__group">Jouw Kompas</div>
        <div class="sidebar__mascot-wrap">
          <img class="mascot-corner" src="../../../Jobsy.Web/wwwroot/images/brand/mascot-64.webp" alt="" width="44" height="44" />
          <p>Fijn dat je meedoet — we houden het kort en duidelijk.</p>
        </div>
      </aside>
      <div class="main-col">
        <main class="main page-pad">
          <div class="progress" role="progressbar" aria-valuenow="1" aria-valuemin="1" aria-valuemax="10"><span class="progress__fill" style="width:10%"></span></div>
          <p class="step-badge">Stap 1 van 10</p>
          <h1 class="hero-title">Even kennismaken</h1>
          <p class="hero-lead">Zodat werkgevers je kunnen bereiken en we reistijd realistisch kunnen inschatten.</p>
          <div class="card">
            <div class="field-row">
              <label class="field"><span>Voornaam</span><input type="text" value="Sam" autocomplete="given-name" /></label>
              <label class="field"><span>Achternaam</span><input type="text" value="de Vries" autocomplete="family-name" /></label>
            </div>
            <label class="field"><span>Woonadres</span></label>
            <div class="address-row">
              <label class="field" style="margin:0"><span class="visually-hidden">Adres</span><input type="text" value="Molenstraat 12, Naaldwijk" autocomplete="street-address" /></label>
              <button type="button" class="btn-gps" aria-label="Gebruik mijn locatie">📍 GPS</button>
            </div>
            <label class="field"><span>Telefoon</span><input type="tel" value="06 12345678" autocomplete="tel" /></label>
            <label class="field"><span>Geboortedatum</span><input type="date" value="1998-04-15" /></label>
          </div>
          <div class="mobile-mascot"><img class="mascot-corner" src="../../../Jobsy.Web/wwwroot/images/brand/mascot-64.webp" alt="" width="44" height="44" /></div>
        </main>
        <footer class="sticky-bar">
          <button type="button" class="btn-ghost">Terug</button>
          <button type="button" class="btn-primary">Volgende</button>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
