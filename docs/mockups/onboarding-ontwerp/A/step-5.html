<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboarding A — Stap 5</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <div class="topbar__brand">
        <img class="logo" src="../shared/assets/lobsy-64.webp" alt="" width="36" height="36" />
        Lobsy
      </div>
      <p class="topbar__meta">Stap 5 · ± 3 min</p>
    </header>
    <div class="shell">
      <div class="main-col">
        <main class="main page-pad">
          <div class="progress" role="progressbar" aria-valuenow="5" aria-valuemin="1" aria-valuemax="10"><span class="progress__fill" style="width:50%"></span></div>
          <p class="step-badge">Stap 5 van 10 · Optioneel</p>
          <h1 class="hero-title">Wat is je opleiding?</h1>
          <p class="hero-lead">Kies je hoogste afgeronde opleiding. Geen diploma? Kies Geen.</p>
          <div class="card">
            <p style="margin:0 0 0.65rem;font-size:0.875rem;font-weight:600">Kies je opleidingsniveau</p>
            <div class="chip-grid" role="radiogroup" aria-label="Opleidingsniveau">
              <button type="button" class="chip">Geen</button>
              <button type="button" class="chip">Basisschool</button>
              <button type="button" class="chip">VMBO</button>
              <button type="button" class="chip">HAVO</button>
              <button type="button" class="chip">VWO</button>
              <button type="button" class="chip is-selected">MBO</button>
              <button type="button" class="chip">HBO</button>
              <button type="button" class="chip">WO</button>
            </div>
          </div>
          <div class="mobile-mascot"><img class="mascot-corner" src="../shared/assets/mascot-64.webp" alt="" width="40" height="40" /></div>
        </main>
        <footer class="sticky-bar">
          <button type="button" class="btn-ghost">Terug</button>
          <button type="button" class="btn-primary">Volgende</button>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
