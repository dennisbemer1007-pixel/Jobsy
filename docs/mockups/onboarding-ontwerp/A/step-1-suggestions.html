<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboarding A — Stap 1 suggesties</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <div class="topbar__brand">
        <img class="logo" src="../../../Jobsy.Web/wwwroot/images/brand/lobsy-64.webp" alt="" width="36" height="36" />
        Lobsy
      </div>
      <p class="topbar__meta">Stap 1 · ± 6 min</p>
    </header>
    <div class="shell">
      <div class="main-col">
        <main class="main page-pad">
          <div class="progress" role="progressbar" aria-valuenow="1" aria-valuemin="1" aria-valuemax="10"><span class="progress__fill" style="width:10%"></span></div>
          <p class="step-badge">Stap 1 van 10</p>
          <h1 class="hero-title">Even kennismaken</h1>
          <p class="hero-lead">Zodat werkgevers je kunnen bereiken en we reistijd realistisch kunnen inschatten.</p>
          <div class="card">
            <div class="field-row">
              <label class="field"><span>Voornaam</span><input type="text" value="Sam" /></label>
              <label class="field"><span>Achternaam</span><input type="text" value="de Vries" /></label>
            </div>
            <label class="field"><span>Woonadres</span></label>
            <div class="address-row">
              <label class="field" style="margin:0"><span class="visually-hidden">Adres</span><input type="text" value="Molen" autocomplete="street-address" /></label>
              <button type="button" class="btn-gps" aria-label="Gebruik mijn locatie">📍 GPS</button>
            </div>
            <ul class="suggest-list" role="listbox" aria-label="Adresuggesties">
              <li><button type="button" class="is-highlight">Molenstraat 12, 2671 Naaldwijk</button></li>
              <li><button type="button">Molenweg 4, 2675 KB Honselersdijk</button></li>
              <li><button type="button">Molenvliet 88, 3144 AB Maassluis</button></li>
            </ul>
            <label class="field"><span>Telefoon</span><input type="tel" value="06 12345678" /></label>
          </div>
        </main>
        <footer class="sticky-bar">
          <button type="button" class="btn-ghost">Terug</button>
          <button type="button" class="btn-primary">Volgende</button>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
