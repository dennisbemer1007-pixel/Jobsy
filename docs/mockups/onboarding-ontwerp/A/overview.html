<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>Richting A — mobile overzicht</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 20px 40px;
      font-family: "Segoe UI", Helvetica Neue, Arial, sans-serif;
      background: #e8e4de;
      color: #122033;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
      font-weight: 700;
    }
    p.lead {
      margin: 0 0 24px;
      color: #5a6a7d;
      font-size: 0.9375rem;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      align-items: flex-start;
    }
    .shot {
      width: 390px;
      flex-shrink: 0;
    }
    .shot h2 {
      margin: 0 0 8px;
      font-size: 0.875rem;
      font-weight: 700;
      text-align: center;
    }
    .shot img {
      width: 390px;
      height: 844px;
      object-fit: cover;
      object-position: top;
      border-radius: 16px;
      border: 1px solid #ddd5cc;
      box-shadow: 0 12px 32px rgba(15, 45, 92, 0.14);
      background: #fffcfa;
    }
  </style>
</head>
<body>
  <h1>Richting A — mobile (390×844)</h1>
  <p class="lead">Stap 1 · Stap 3 · Stap 8 naast elkaar</p>
  <div class="row">
    <div class="shot"><h2>Stap 1 — Even kennismaken</h2><img src="step-1-mobile-390x844.png" alt="" /></div>
    <div class="shot"><h2>Stap 3 — Vervoer</h2><img src="step-3-mobile-390x844.png" alt="" /></div>
    <div class="shot"><h2>Stap 8 — Mini-test</h2><img src="step-8-mobile-390x844.png" alt="" /></div>
  </div>
</body>
</html>
