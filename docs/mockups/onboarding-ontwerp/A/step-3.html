<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboarding A — Stap 3</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <div class="topbar__brand">
        <img class="logo" src="../shared/assets/lobsy-64.webp" alt="" width="36" height="36" />
        Lobsy
      </div>
      <p class="topbar__meta">Stap 3 · ± 4 min</p>
    </header>
    <div class="shell">
      <div class="main-col">
        <main class="main page-pad">
          <div class="progress" role="progressbar" aria-valuenow="3" aria-valuemin="1" aria-valuemax="10"><span class="progress__fill" style="width:30%"></span></div>
          <p class="step-badge">Stap 3 van 10</p>
          <h1 class="hero-title">Hoe kom je op je werk?</h1>
          <p class="hero-lead">Dan laten we alleen banen zien die goed te bereiken zijn.</p>
          <div class="card">
            <p style="margin:0 0 0.25rem;font-size:0.875rem;font-weight:600">Vervoer</p>
            <p style="margin:0 0 0.65rem;font-size:0.8125rem;color:var(--muted)">Je mag meer dan één optie kiezen.</p>
            <div class="transport-grid" role="group" aria-label="Vervoer">
              <button type="button" class="transport-tile is-selected">Fiets</button>
              <button type="button" class="transport-tile">E-bike</button>
              <button type="button" class="transport-tile">Auto</button>
              <button type="button" class="transport-tile">OV</button>
              <button type="button" class="transport-tile">Lopend</button>
            </div>
            <p style="margin:0 0 0.35rem;font-size:0.875rem;font-weight:600">Maximaal reizen <strong style="color:var(--brand)">30 min</strong></p>
            <div class="travel-time-row" role="group" aria-label="Maximaal reizen">
              <button type="button" class="travel-time-tile">10</button>
              <button type="button" class="travel-time-tile">20</button>
              <button type="button" class="travel-time-tile is-selected">30</button>
              <button type="button" class="travel-time-tile">45</button>
            </div>
            <button type="button" class="link-anders">Anders</button>
          </div>
          <div class="mobile-mascot"><img class="mascot-corner" src="../shared/assets/mascot-64.webp" alt="" width="40" height="40" /></div>
        </main>
        <footer class="sticky-bar">
          <button type="button" class="btn-ghost">Terug</button>
          <button type="button" class="btn-primary">Volgende</button>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
