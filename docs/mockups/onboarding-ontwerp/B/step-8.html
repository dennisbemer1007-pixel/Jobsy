<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboarding B — Stap 8</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:0.5rem">
        <img class="logo" src="../shared/assets/lobsy-64.webp" alt="" width="32" height="32" />
        <span>Lobsy</span>
      </div>
      <span style="font-size:0.8125rem;color:var(--muted)">8 / 10</span>
    </header>
    <div class="shell">
      <div class="main-col">
        <main class="main page-pad">
          <div class="phase-chips">
            <span class="phase-chip is-done">✓ Hoe je werkt</span>
            <span class="phase-chip is-active">Leuk</span>
            <span class="phase-chip">Sfeer</span>
            <span class="phase-chip">Waarden</span>
          </div>
          <h2 class="hero-title">Wat vind je leuk?</h2>
          <p class="hero-lead">Hoe goed past deze zin bij jou? Er zijn geen foute antwoorden.</p>
          <div class="content-surface">
            <p class="question-counter">Vraag 1 van 5</p>
            <p class="likert-q">Ik werk graag met machines, gereedschap of buiten in de praktijk.</p>
            <div class="likert-row">
              <button type="button" class="likert-btn">1</button>
              <button type="button" class="likert-btn">2</button>
              <button type="button" class="likert-btn">3</button>
              <button type="button" class="likert-btn is-selected">4</button>
              <button type="button" class="likert-btn">5</button>
            </div>
            <p class="likert-hint">Past niet · Past heel goed</p>
          </div>
        </main>
        <footer class="sticky-bar">
          <button type="button" class="btn-ghost">Terug</button>
          <button type="button" class="btn-primary">Volgende</button>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
