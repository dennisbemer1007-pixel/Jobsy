<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboarding B — Stap 5</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:0.5rem">
        <img class="logo" src="../shared/assets/lobsy-64.webp" alt="" width="32" height="32" />
        <span>Lobsy</span>
      </div>
      <span style="font-size:0.8125rem;color:var(--muted)">5 / 10</span>
    </header>
    <div class="shell">
      <div class="main-col">
        <aside class="context-panel">
          <h2>Waarom vragen we dit?</h2>
          <p>Sommige vacatures vragen een bepaald opleidingsniveau.</p>
        </aside>
        <main class="main page-pad">
          <p class="step-line">Stap 5 van 10 · Optioneel</p>
          <h2 class="hero-title">Wat is je opleiding?</h2>
          <p class="hero-lead">Kies je hoogste afgeronde opleiding. Geen diploma? Kies Geen.</p>
          <div class="content-surface">
            <p style="margin:0 0 0.65rem;font-weight:600;font-size:0.875rem">Kies je opleidingsniveau</p>
            <div class="chip-grid">
              <button type="button" class="chip">Geen</button>
              <button type="button" class="chip">Basisschool</button>
              <button type="button" class="chip">VMBO</button>
              <button type="button" class="chip">HAVO</button>
              <button type="button" class="chip">VWO</button>
              <button type="button" class="chip is-selected">MBO</button>
              <button type="button" class="chip">HBO</button>
              <button type="button" class="chip">WO</button>
            </div>
          </div>
        </main>
        <footer class="sticky-bar">
          <button type="button" class="btn-ghost">Terug</button>
          <button type="button" class="btn-primary">Volgende</button>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
