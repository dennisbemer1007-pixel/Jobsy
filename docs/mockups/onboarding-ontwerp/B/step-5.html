<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboarding B — Stap 5</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:0.5rem">
        <img class="logo" src="../../../Jobsy.Web/wwwroot/images/brand/lobsy-64.webp" alt="" width="32" height="32" />
        <span>Lobsy</span>
      </div>
      <span style="font-size:0.8125rem;color:var(--muted)">5 / 10</span>
    </header>
    <div class="shell">
      <div class="main-col">
        <aside class="context-panel">
          <h2>Waarom vragen we dit?</h2>
          <p>Sommige vacatures vragen een bepaald niveau. Zo tonen we geen functies waar je niet voor in aanmerking komt.</p>
        </aside>
        <main class="main page-pad">
          <p class="step-line">Stap 5 van 10</p>
          <h2 class="hero-title">Opleiding</h2>
          <p class="hero-lead">Welk diploma heb je als laatste behaald?</p>
          <div class="content-surface">
            <div class="chip-grid">
              <button type="button" class="chip">VMBO</button>
              <button type="button" class="chip is-selected">MBO 3</button>
              <button type="button" class="chip">MBO 4</button>
              <button type="button" class="chip">HBO</button>
            </div>
            <label class="field"><span>Richting (optioneel)</span><input type="text" value="Groen &amp; tuin" /></label>
          </div>
        </main>
        <footer class="sticky-bar">
          <button type="button" class="btn-ghost">Terug</button>
          <button type="button" class="btn-primary">Volgende</button>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
