<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboarding B — Stap 3</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:0.5rem">
        <img class="logo" src="../shared/assets/lobsy-64.webp" alt="" width="32" height="32" />
        <span>Lobsy</span>
      </div>
      <span style="font-size:0.8125rem;color:var(--muted)">3 / 10</span>
    </header>
    <div class="shell">
      <div class="main-col">
        <aside class="context-panel">
          <h2>Waarom vragen we dit?</h2>
          <p>Reistijd bepaalt of een baan in het dagelijks leven past.</p>
        </aside>
        <main class="main page-pad">
          <p class="step-line">Stap 3 van 10</p>
          <h2 class="hero-title">Hoe kom je op je werk?</h2>
          <p class="hero-lead">Dan laten we alleen banen zien die goed te bereiken zijn.</p>
          <div class="content-surface">
            <p style="margin:0 0 0.25rem;font-weight:600;font-size:0.875rem">Vervoer</p>
            <p style="margin:0 0 0.65rem;font-size:0.8125rem;color:var(--muted)">Je mag meer dan één optie kiezen.</p>
            <div class="transport-grid">
              <button type="button" class="transport-tile is-selected">Fiets</button>
              <button type="button" class="transport-tile">E-bike</button>
              <button type="button" class="transport-tile">Auto</button>
              <button type="button" class="transport-tile">OV</button>
              <button type="button" class="transport-tile">Lopend</button>
            </div>
            <p style="margin:0 0 0.35rem;font-weight:600;font-size:0.875rem">Maximaal reizen <strong>30 min</strong></p>
            <div class="travel-time-row">
              <button type="button" class="travel-time-tile">10</button>
              <button type="button" class="travel-time-tile">20</button>
              <button type="button" class="travel-time-tile is-selected">30</button>
              <button type="button" class="travel-time-tile">45</button>
            </div>
            <button type="button" class="link-anders">Anders</button>
          </div>
        </main>
        <footer class="sticky-bar">
          <button type="button" class="btn-ghost">Terug</button>
          <button type="button" class="btn-primary">Volgende</button>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
