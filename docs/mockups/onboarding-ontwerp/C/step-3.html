<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboarding C — Stap 3</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <img class="logo" src="../shared/assets/lobsy-64.webp" alt="Lobsy" width="40" height="40" />
      <span class="topbar__step">3/10</span>
    </header>
    <div class="shell">
      <div class="main-col">
        <main class="main page-pad">
          <p class="eyebrow">Hoe kom je op je werk?</p>
          <h1 class="hero-title">Vervoer</h1>
          <p class="hero-lead">Dan laten we alleen banen zien die goed te bereiken zijn.</p>
          <div class="transport-list">
            <button type="button" class="transport-option is-selected">Fiets</button>
            <button type="button" class="transport-option">E-bike</button>
            <button type="button" class="transport-option">Auto</button>
            <button type="button" class="transport-option">OV</button>
            <button type="button" class="transport-option">Lopend</button>
          </div>
          <p style="margin:1rem 0 0.35rem;font-weight:600">Maximaal reizen · 30 min</p>
          <div class="travel-time-row">
            <button type="button" class="travel-time-tile">10</button>
            <button type="button" class="travel-time-tile">20</button>
            <button type="button" class="travel-time-tile is-selected">30</button>
            <button type="button" class="travel-time-tile">45</button>
          </div>
          <button type="button" class="link-anders">Anders</button>
        </main>
        <footer class="sticky-bar">
          <button type="button" class="btn-ghost">Terug</button>
          <button type="button" class="btn-primary">Volgende</button>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
