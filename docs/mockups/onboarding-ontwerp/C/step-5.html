<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboarding C — Stap 5</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <img class="logo" src="../shared/assets/lobsy-64.webp" alt="Lobsy" width="40" height="40" />
      <span class="topbar__step">5/10</span>
    </header>
    <div class="shell">
      <div class="main-col">
        <main class="main page-pad">
          <p class="eyebrow">Optioneel</p>
          <h1 class="hero-title">Wat is je opleiding?</h1>
          <p class="hero-lead">Kies je hoogste afgeronde opleiding. Geen diploma? Kies Geen.</p>
          <div class="transport-list">
            <button type="button" class="transport-option">Geen</button>
            <button type="button" class="transport-option">Basisschool</button>
            <button type="button" class="transport-option">VMBO</button>
            <button type="button" class="transport-option">HAVO</button>
            <button type="button" class="transport-option">VWO</button>
            <button type="button" class="transport-option is-selected">MBO</button>
            <button type="button" class="transport-option">HBO</button>
            <button type="button" class="transport-option">WO</button>
          </div>
        </main>
        <footer class="sticky-bar">
          <button type="button" class="btn-ghost">Terug</button>
          <button type="button" class="btn-primary">Volgende</button>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
