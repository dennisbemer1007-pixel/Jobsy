<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboarding C — Stap 5</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <img class="logo" src="../../../Jobsy.Web/wwwroot/images/brand/lobsy-64.webp" alt="Lobsy" width="40" height="40" />
      <span class="topbar__step">5/10</span>
    </header>
    <div class="shell">
      <div class="main-col">
        <main class="main page-pad">
          <p class="eyebrow">Opleiding</p>
          <h1 class="hero-title">Hoogste afgeronde niveau?</h1>
          <p class="hero-lead">Tik het niveau dat het best past.</p>
          <div class="transport-list">
            <button type="button" class="transport-option">VMBO</button>
            <button type="button" class="transport-option is-selected">MBO 3</button>
            <button type="button" class="transport-option">MBO 4</button>
            <button type="button" class="transport-option">HBO</button>
            <button type="button" class="transport-option">WO</button>
          </div>
          <label class="field"><span>Richting (optioneel)</span><input type="text" placeholder="Bijv. zorg, techniek" /></label>
        </main>
        <footer class="sticky-bar">
          <button type="button" class="btn-ghost">Terug</button>
          <button type="button" class="btn-primary">Volgende</button>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
