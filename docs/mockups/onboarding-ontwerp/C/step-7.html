<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboarding C — Stap 7</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <img class="logo" src="../../../Jobsy.Web/wwwroot/images/brand/lobsy-64.webp" alt="Lobsy" width="40" height="40" />
      <span class="topbar__step">7/10</span>
    </header>
    <div class="shell">
      <div class="main-col">
        <main class="main page-pad">
          <p class="eyebrow">Nu even over jou</p>
          <h1 class="hero-title">Mag Lobsy je antwoorden gebruiken voor matches?</h1>
          <p class="hero-lead">Kort en helder — daarna volgen de mini-tests.</p>
          <div class="consent-panel">
            <p>We gebruiken je testantwoorden alleen om passende vacatures te tonen. Geen spam, geen verkoop aan derden.</p>
            <button type="button" class="btn-primary">Ja, dat is oké</button>
          </div>
          <p style="font-size:0.8125rem;color:var(--muted)"><a href="#" style="color:var(--soft-accent-ink);font-weight:600">Privacybeleid</a></p>
        </main>
        <footer class="sticky-bar">
          <button type="button" class="btn-ghost">Terug</button>
          <button type="button" class="btn-primary" disabled style="opacity:0.45">Volgende</button>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
