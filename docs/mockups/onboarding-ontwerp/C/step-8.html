<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboarding C — Stap 8</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <img class="logo" src="../../../Jobsy.Web/wwwroot/images/brand/lobsy-64.webp" alt="Lobsy" width="40" height="40" />
      <span class="topbar__step">8/10</span>
    </header>
    <div class="shell">
      <nav class="rail" aria-hidden="true">
        <span class="rail__dot is-done"></span>
        <span class="rail__dot is-done"></span>
        <span class="rail__dot is-done"></span>
        <span class="rail__dot is-done"></span>
        <span class="rail__dot is-active"></span>
      </nav>
      <nav class="desktop-groups" aria-label="Stappen">
        <ol>
          <li>Over jou</li>
          <li>Achtergrond</li>
          <li>Droom</li>
          <li>Wie ben jij</li>
          <li class="is-active">Jouw Kompas</li>
        </ol>
      </nav>
      <div class="main-col">
        <main class="main page-pad">
          <div class="phase-row">
            <span class="phase-pill is-active">Hoe je werkt</span>
            <span class="phase-pill">Leuk</span>
            <span class="phase-pill">Sfeer</span>
            <span class="phase-pill">Waarden</span>
          </div>
          <p class="eyebrow">Mini-test · vraag 1 van 5</p>
          <p class="likert-q">Ik werk het prettigst wanneer ik samen met collega’s kan schakelen.</p>
          <div class="likert-scale" role="radiogroup" aria-label="1 tot 5">
            <button type="button">1</button>
            <button type="button">2</button>
            <button type="button">3</button>
            <button type="button" class="is-selected">4</button>
            <button type="button">5</button>
          </div>
          <div class="likert-caption"><span>Nee</span><span>Ja</span></div>
          <div class="mascot-float"><img class="mascot-corner" src="../../../Jobsy.Web/wwwroot/images/brand/mascot-64.webp" alt="" width="40" height="40" /></div>
        </main>
        <footer class="sticky-bar">
          <button type="button" class="btn-ghost">Terug</button>
          <button type="button" class="btn-primary">Volgende</button>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
