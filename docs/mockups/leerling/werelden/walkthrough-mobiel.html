<div class="stage"><div class="phone"><div id="scroll"><img id="img" alt=""></div></div></div><script>const I=[{"f": "renders/mobile/00-kies-je-wereld.png", "ch": "Start", "t": "Kies jouw wereld", "c": "Het kind kiest met één tik een wereld. Zelfde vragen en spellen, alleen een andere wereld. Wisselen kan later via Pauze."}, {"f": "renders/mobile/01-zee-route.png", "ch": "Zee-expeditie", "t": "De route", "c": "Zeekaart van de haven naar jouw eiland. De leerling staat bij de start."}, {"f": "renders/mobile/02-zee-vraag.png", "ch": "Zee-expeditie", "t": "Vraag 1 van 60", "c": "Voorbeeldvraag in het Koraalrif. Dezelfde vraag als in de andere werelden."}, {"f": "renders/mobile/03-zee-puzzel-intro.png", "ch": "Zee-expeditie", "t": "Puzzel 1: Schelpenrij", "c": "Uitleg van het eerste denkspel, na vraag 15."}, {"f": "renders/mobile/04-eilandtuin-route.png", "ch": "Eilandtuin", "t": "De route", "c": "Tuinkaart met bloemen, koraal, waterval en lagune. De leerling staat bij de steiger."}, {"f": "renders/mobile/05-eilandtuin-vraag.png", "ch": "Eilandtuin", "t": "Vraag 1 van 60", "c": "Dezelfde voorbeeldvraag, nu in de Bloemenbaai."}, {"f": "renders/mobile/06-eilandtuin-puzzel-intro.png", "ch": "Eilandtuin", "t": "Puzzel 1: Schelpenrij", "c": "Hetzelfde denkspel met dezelfde regels, in de koraaltuin."}, {"f": "renders/mobile/07-sterrenkust-route.png", "ch": "Sterrenkust", "t": "De route", "c": "De route is een sterrenbeeld boven de kust. Elke ster is een stop."}, {"f": "renders/mobile/08-sterrenkust-vraag.png", "ch": "Sterrenkust", "t": "Vraag 1 van 60", "c": "Dezelfde voorbeeldvraag, nu op het Duinpad."}, {"f": "renders/mobile/09-sterrenkust-puzzel-intro.png", "ch": "Sterrenkust", "t": "Puzzel 1: Schelpenrij", "c": "Hetzelfde denkspel met dezelfde regels, op het maanstrand."}, {"f": "renders/mobile/10-zee-result.png", "ch": "Zee-expeditie", "t": "Dit ben jij", "c": "Uitkomst na 60 vragen en alle puzzels: verhaal, vier tegels, interesses en beroepsideeën."}, {"f": "renders/mobile/10-eilandtuin-result.png", "ch": "Eilandtuin", "t": "Dit ben jij", "c": "Dezelfde uitkomst als in de andere werelden, in tuin-stijl met voltooide reisbalk."}, {"f": "renders/mobile/10-sterrenkust-result.png", "ch": "Sterrenkust", "t": "Dit ben jij", "c": "Dezelfde uitkomst, op het maanstrand met goudaccenten en voltooide sterrenroute."}];let i=0;const $=x=>document.getElementById(x);
I.forEach((s,k)=>{const o=document.createElement('option');o.value=k;o.textContent=(k+1)+'. '+s.ch+' · '+s.t;$('sel').appendChild(o)});
function show(n){i=Math.max(0,Math.min(I.length-1,n));const s=I[i];$('img').src=s.f;$('ch').textContent=(i+1)+' van '+I.length+' · '+s.ch;$('t').textContent=s.t;$('c').textContent=s.c;$('sel').value=i;$('prev').disabled=i==0;$('next').disabled=i==I.length-1;$('scroll').scrollTop=0}
$('prev').onclick=()=>show(i-1);$('next').onclick=()=>show(i+1);$('sel').onchange=e=>show(+e.target.value);$('img').onclick=()=>show(i+1);
document.onkeydown=e=>{if(e.key=='ArrowRight')show(i+1);if(e.key=='ArrowLeft')show(i-1)};show(0);</script></body></html>
