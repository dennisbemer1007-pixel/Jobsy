<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" class="kk-map-svg" aria-hidden="true">
  <defs>
    <pattern id="bld" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#f5f2ed"/>
      <path d="M0 12 L12 0" stroke="#ebe6df" stroke-width="0.5"/>
    </pattern>
    <filter id="lbl" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#fff" flood-opacity="0.9"/>
    </filter>
  </defs>
  <!-- base land (OSM-like) -->
  <rect width="1200" height="900" fill="#f2efe8"/>
  <rect x="0" y="0" width="1200" height="900" fill="url(#bld)" opacity="0.55"/>
  <!-- forest / heuvelrug -->
  <path fill="#dce8d4" d="M680 120 Q820 80 950 140 T1050 320 Q980 420 820 400 T680 280 Z"/>
  <path fill="#d4e4cc" opacity="0.85" d="M720 180 Q800 150 880 200 T920 300 Q860 360 760 340 T700 240 Z"/>
  <!-- water: Eem & canals -->
  <path fill="#c5d9ea" d="M0 520 Q180 500 260 540 T420 560 Q500 580 580 550 T720 570 Q840 590 920 560 L1200 600 L1200 900 L0 900 Z"/>
  <path fill="#b8cfe0" d="M340 380 Q380 360 420 380 T480 420 Q440 460 400 450 T340 400 Z"/>
  <path fill="#b8cfe0" d="M880 480 Q920 470 960 490 T980 530 Q940 550 900 540 T860 510 Z"/>
  <!-- major roads (A28, A1) -->
  <path fill="none" stroke="#f5e6a8" stroke-width="14" stroke-linecap="round" d="M80 200 L520 240 L920 280"/>
  <path fill="none" stroke="#e8d890" stroke-width="10" stroke-linecap="round" d="M200 80 L280 420 L360 720"/>
  <path fill="none" stroke="#f5e6a8" stroke-width="12" stroke-linecap="round" d="M100 650 L600 620 L1100 580"/>
  <!-- secondary roads -->
  <g stroke="#ffffff" stroke-width="5" fill="none" opacity="0.95">
    <path d="M420 120 L480 380 L520 620"/>
    <path d="M620 140 L580 400 L540 680"/>
    <path d="M240 320 L720 340"/>
    <path d="M300 480 L900 460"/>
    <path d="M760 200 L820 500"/>
  </g>
  <g stroke="#d8d2c8" stroke-width="2.5" fill="none">
    <path d="M380 260 L620 280 L780 320"/>
    <path d="M450 500 L650 490 L850 480"/>
    <path d="M520 180 L560 520"/>
  </g>
  <!-- candidate heat regions -->
  <g class="heat-regions">
    <path class="heat" id="reg-hilversum" d="M780 140 Q860 120 920 160 T940 240 Q880 280 800 260 T740 200 Z"/>
    <path class="heat heat--strong" id="reg-amersfoort" d="M460 300 Q540 270 600 310 T640 390 Q590 440 520 430 T440 380 T420 340 Z"/>
    <path class="heat" id="reg-soest" d="M280 220 Q340 200 380 240 T400 320 Q350 360 290 340 T250 280 Z"/>
    <path class="heat heat--strong" id="reg-utrecht" d="M180 480 Q260 450 320 490 T350 580 Q280 620 210 590 T160 530 Z"/>
    <path class="heat" id="reg-leusden" d="M520 380 Q580 360 620 400 T630 470 Q580 500 530 480 T500 420 Z"/>
  </g>
  <!-- selected overlay (hidden via CSS when not .map-has-selection) -->
  <path class="heat heat--sel" id="reg-selected" d="M460 300 Q540 270 600 310 T640 390 Q590 440 520 430 T440 380 T420 340 Z"/>
  <!-- radius 25km subtle -->
  <circle class="radius" cx="530" cy="360" r="210"/>
  <circle class="employer-pin" cx="530" cy="360" r="9"/>
  <circle fill="#fff" cx="530" cy="360" r="4"/>
  <!-- count labels -->
  <g class="heat-labels" filter="url(#lbl)">
    <g class="heat-label" transform="translate(820,200)"><rect x="-22" y="-14" width="44" height="28" rx="14" fill="rgba(255,252,250,0.92)" stroke="#ddd5cc"/><text x="0" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#122033" font-family="Segoe UI,Arial,sans-serif">31</text></g>
    <g class="heat-label" transform="translate(530,365)"><rect x="-24" y="-14" width="48" height="28" rx="14" fill="rgba(255,252,250,0.95)" stroke="#f54a1b" stroke-opacity="0.35"/><text x="0" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f2d5c" font-family="Segoe UI,Arial,sans-serif">42</text></g>
    <g class="heat-label" transform="translate(330,280)"><rect x="-22" y="-14" width="44" height="28" rx="14" fill="rgba(255,252,250,0.92)" stroke="#ddd5cc"/><text x="0" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#122033" font-family="Segoe UI,Arial,sans-serif">38</text></g>
    <g class="heat-label" transform="translate(250,530)"><rect x="-22" y="-14" width="44" height="28" rx="14" fill="rgba(255,252,250,0.92)" stroke="#ddd5cc"/><text x="0" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#122033" font-family="Segoe UI,Arial,sans-serif">56</text></g>
    <g class="heat-label" transform="translate(565,445)"><rect x="-22" y="-14" width="44" height="28" rx="14" fill="rgba(255,252,250,0.92)" stroke="#ddd5cc"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="600" fill="#5a6a7d" font-family="Segoe UI,Arial,sans-serif">35</text></g>
  </g>
  <!-- place names -->
  <g class="place-labels" fill="#5a6a7d" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">
    <text x="520" y="345" text-anchor="middle" fill="#0f2d5c">Amersfoort</text>
    <text x="575" y="455" text-anchor="middle" font-size="13">Leusden</text>
    <text x="325" y="265" text-anchor="middle" font-size="14">Soest</text>
    <text x="395" y="305" text-anchor="middle" font-size="13" fill="#5a6a7d">Baarn</text>
    <text x="235" y="515" text-anchor="middle" font-size="14">Utrecht</text>
    <text x="835" y="195" text-anchor="middle" font-size="14">Hilversum</text>
  </g>
  <!-- OSM attribution style -->
  <text x="1180" y="890" text-anchor="end" font-size="10" fill="#8a7d70" font-family="Segoe UI,Arial,sans-serif">© mock kaart</text>
</svg>
