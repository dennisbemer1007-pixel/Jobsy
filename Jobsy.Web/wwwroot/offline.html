<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline · Lobsy</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f3ef;
            --text: #1c1917;
            --muted: #78716c;
            --brand: #c45c26;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            font-family: "Segoe UI", system-ui, sans-serif;
            background:
                radial-gradient(1200px 600px at 10% -10%, #fde8d8 0%, transparent 55%),
                radial-gradient(900px 500px at 100% 0%, #e8f0ea 0%, transparent 50%),
                var(--bg);
            color: var(--text);
        }
        main {
            max-width: 22rem;
            text-align: center;
        }
        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        p {
            margin: 0 0 1.25rem;
            color: var(--muted);
            line-height: 1.45;
        }
        a {
            display: inline-block;
            padding: 0.7rem 1.1rem;
            border-radius: 0.55rem;
            background: var(--brand);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main>
        <h1>Lobsy</h1>
        <p>Je bent offline. Controleer je verbinding en probeer het opnieuw.</p>
        <a href="/">Opnieuw laden</a>
    </main>
</body>
</html>
